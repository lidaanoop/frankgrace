<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wormhole: Lethal Company Style</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="stat">Health <span id="healthValue">100</span></div>
      <div class="stat">Oxygen <span id="oxygenValue">100</span></div>
      <div class="stat">Stamina <span id="staminaValue">100</span></div>
      <div class="stat">Room <span id="roomValue">100</span></div>
      <div class="stat">Objective <span id="objectiveValue">Find the lever</span></div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="messageBox" class="message-box hidden"></div>

    <script src="script.js"></script>
  </body>
</html>
